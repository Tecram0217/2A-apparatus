<!DOCTYPE html>
<html lang="ja">
<head>
  <title>終了案内</title>
  <link rel="icon" type="image/png" href="assets/CODE2A.png.png">
  <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="gate-body exit-body">

  <header class="gate-topbar">
    <div class="gate-brand"><span class="gate-brand-mark" aria-hidden="true"></span><a href="index.html" style="color: inherit; text-decoration: none;">SPECTRA</a></div>
    <div class="gate-classification">CODE:2A / <b>MISSION COMPLETE</b></div>
  </header>

  <main class="gate-main exit-page">
    <div class="exit-page-content">
      <section class="exit-guidance" aria-labelledby="exit-guidance-title">
        <header class="exit-mission-head">
          <h1 class="exit-mission-title" id="exit-guidance-title">MISSION COMPLETE</h1>
          <span>FINAL NOTICE</span>
        </header>
        <p class="exit-lead">体験はこれで終了です</p>
        <p class="exit-guidance-summary">すべてのミッションが完了しました。最後に、以下の案内をご確認ください。</p>
        <p class="exit-guidance-label">EXIT GUIDANCE</p>
        <div class="exit-instructions">
          <p><span class="exit-instruction-mark" aria-hidden="true"></span><span>案内に従って、<strong>出口へお進みください。</strong></span></p>
          <p><span class="exit-instruction-mark" aria-hidden="true"></span><span>筆記用具など、<strong>使用したものはすべて返却してください。</strong></span></p>
        </div>
      </section>

      <div class="return-container">
        <a href="index.html" class="return-button">
          <span class="return-arrow">←</span>
          消失装置の画面へ戻る
        </a>
      </div>
    </div>
  </main>

  <div class="page-transition covered" id="page-transition" aria-hidden="false">
    <span class="slab"></span>
    <span class="stripe"></span>
    <span class="transition-copy" id="transition-copy">MISSION / COMPLETE</span>
  </div>

  <script src="ending.js"></script>
</body>
</html>
